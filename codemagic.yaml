workflows:
  macos-build:
    name: macOS Build
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      node: 20.11.0
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Build macOS app
        script: npm run build:mac
    artifacts:
      - dist/*.dmg
      - dist/*.dmg.blockmap
